<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOBULAR</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; font-family: 'Courier New', Courier, monospace; touch-action: manipulation; }
        #menu { text-align: center; background: #111; padding: 40px; border: 5px solid #ffff00; z-index: 100; display: flex; flex-direction: column; align-items: center; }
        #titulo { font-size: clamp(60px, 15vw, 120px); font-weight: bold; color: #ffff00; margin: 0; }
        .download-link { color: #ffff00; text-decoration: underline; margin-top: 10px; font-size: 18px; cursor: pointer; }
        
        #game-container { display: none; flex-direction: column; align-items: center; position: relative; width: 100%; height: 100%; }
        #stats { font-size: 20px; margin-top: 10px; color: #ffff00; display: flex; gap: 20px; z-index: 5; }
        canvas { background: rgb(0, 0, 50); border: 4px solid #444; max-width: 100%; max-height: 65vh; }
        
        #controles { display: flex; width: 100%; max-width: 800px; justify-content: space-between; padding: 10px; position: absolute; bottom: 10px; pointer-events: none; }
        .btn-grupo { display: flex; gap: 15px; pointer-events: auto; }
        .boton { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.15); border: 3px solid #ffff00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; user-select: none; color: #ffff00; }
        
        #pausa-overlay, #tutorial-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 150; padding: 20px; text-align: center; }
        .btn-menu { background:#ffff00; padding:15px; margin-top:15px; font-weight:bold; cursor:pointer; border:none; width: 200px; font-family: inherit; }
    </style>
</head>
<body>

    <div id="menu">
        <div id="titulo">TOBULAR</div>
        <a href="tobular.apk" class="download-link">descarga la app! (android)</a>
        <button class="btn-menu" onclick="iniciarTodo()">INICIAR COMBATE</button>
        <button class="btn-menu" onclick="document.getElementById('tutorial-overlay').style.display='flex'">TUTORIAL</button>
    </div>

    <div id="tutorial-overlay">
        <h2 style="color:#ffff00">COMO JUGAR</h2>
        <p>Eres el <b>Pollito Blanco</b>.<br>Esquiva a los <b>Pollos Rojos</b>.<br>Atrapa el <b>Huevo</b> para explotar a los enemigos y dañar al Boss.<br>Usa flechas o botones para moverte y saltar.<br>P = Pausa.</p>
        <button class="btn-menu" onclick="document.getElementById('tutorial-overlay').style.display='none'">ENTENDIDO</button>
    </div>

    <div id="game-container">
        <div id="stats">
            <span>HP: <span id="vida">444</span></span>
            <span>PTS: <span id="puntos">0</span></span>
            <span id="boss-ui" style="color:#ff00ff; display:none; font-weight:bold;">CORE: <span id="boss-hp">44</span></span>
        </div>
        <canvas id="juego" width="800" height="600"></canvas>
        <div id="controles">
            <div class="btn-grupo"><div class="boton" id="btn-izq">←</div><div class="boton" id="btn-der">→</div></div>
            <div class="btn-grupo"><div class="boton" id="btn-pausa" style="font-size:18px;">P</div><div class="boton" id="btn-salto">↑</div></div>
        </div>
        <div id="pausa-overlay" onclick="togglePausa()"><h2 style="color:#ffff00; font-size:50px;">PAUSA</h2><p>Toca para continuar</p></div>
    </div>

<script>
const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d", { alpha: false });

const imgPollo = new Image(); imgPollo.src = "pollo.png";
const imgRojo = new Image(); imgRojo.src = "pollo rojo.png";
const imgHuevo = new Image(); imgHuevo.src = "uevo.png";

const musicaTom = new Audio("tom.mp3");
const musicaCore = new Audio("core.mp3");
const sonidoExp = new Audio("exp.mp3");
const sonidoDano = new Audio("uu.mp3");
musicaTom.loop = true; musicaCore.loop = true;

let puntosVida, score, invulnerable, juegoPausado, juegoFinalizado;
let p, boss, plataformas, enemigos, huevo, flash, spawnTimer, teclas, particulas;

function crearParticulas(x, y, cantidad = 8) {
    for(let i=0; i<cantidad; i++) {
        particulas.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            vida: 60,
            color: "orange"
        });
    }
}

window.onkeydown = (e) => { let k = e.key.toLowerCase(); teclas[k] = true; if (k === 'p') togglePausa(); };
window.onkeyup = (e) => teclas[e.key.toLowerCase()] = false;

function setupBoton(id, tecla) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); if(tecla === 'p') togglePausa(); else teclas[tecla] = true; }, {passive: false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); teclas[tecla] = false; }, {passive: false});
}
setupBoton("btn-izq", "a"); setupBoton("btn-der", "d"); setupBoton("btn-salto", "w"); setupBoton("btn-pausa", "p");

function togglePausa() {
    if (document.getElementById("game-container").style.display === "none" || juegoFinalizado) return;
    juegoPausado = !juegoPausado;
    document.getElementById("pausa-overlay").style.display = juegoPausado ? "flex" : "none";
    if (!juegoPausado) { if(boss.activo) musicaCore.play(); else musicaTom.play(); bucleJuego(); }
    else { musicaTom.pause(); musicaCore.pause(); }
}

function iniciarTodo() {
    puntosVida = 444; score = 0; enemigos = []; particulas = []; boss = { x: -100, y: 100, w: 70, h: 70, vx: 0, vy: 0, hp: 44, activo: false };
    p = { x: 400, y: 100, w: 45, h: 45, vx: 0, vy: 0, enSuelo: false, mirandoDerecha: true };
    plataformas = [{x:0,y:560,w:800,h:40},{x:0,y:400,w:260,h:20},{x:540,y:400,w:260,h:20},{x:250,y:250,w:300,h:20},{x:0,y:120,w:200,h:20},{x:600,y:120,w:200,h:20}];
    huevo = { x: 0, y: 0, activo: false };
    teclas = {}; invulnerable = 0; flash = 0; spawnTimer = 0;
    juegoPausado = false; juegoFinalizado = false;

    document.getElementById("vida").innerText = puntosVida;
    document.getElementById("puntos").innerText = score;
    document.getElementById("boss-ui").style.display = "none";
    document.getElementById("menu").style.display = "none";
    document.getElementById("game-container").style.display = "flex";
    musicaTom.play();
    bucleJuego();
}

function finalizar(mensaje) {
    juegoFinalizado = true;
    let contador = 0;
    let intervalo = setInterval(() => {
        crearParticulas(Math.random()*800, Math.random()*600, 5);
        contador++;
        if(contador > 40) {
            clearInterval(intervalo);
            alert(mensaje);
            musicaTom.pause(); musicaCore.pause();
            document.getElementById("game-container").style.display = "none";
            document.getElementById("menu").style.display = "flex";
        }
    }, 100);
}

function bucleJuego() {
    if (juegoPausado || document.getElementById("game-container").style.display === "none") return;

    // OPTIMIZATION: Use clearRect instead of fillRect for background
    ctx.clearRect(0, 0, 800, 600);
    ctx.fillStyle = boss.activo ? "rgb(40, 0, 40)" : "rgb(0, 0, 50)";
    ctx.fillRect(0, 0, 800, 600);
    
    // Draw platforms
    ctx.fillStyle = "#8B4513";
    for(let i = 0; i < plataformas.length; i++) {
        const pl = plataformas[i];
        ctx.fillRect(Math.floor(pl.x), Math.floor(pl.y), pl.w, pl.h);
    }

    if (!juegoFinalizado) {
        if (teclas["a"] || teclas["arrowleft"]) { p.vx -= 0.8; p.mirandoDerecha = false; }
        if (teclas["d"] || teclas["arrowright"]) { p.vx += 0.8; p.mirandoDerecha = true; }
        if ((teclas["w"] || teclas["arrowup"] || teclas[" "]) && p.enSuelo) { p.vy = -12; p.enSuelo = false; }

        p.vy += 0.35; p.vx *= 0.97; 
        p.x += p.vx; 
        p.y += p.vy;
        
        // Wrap around screen
        if (p.x > 800) p.x = 0; 
        if (p.x < 0) p.x = 800;
        
        p.enSuelo = false;
        
        // Platform collision detection
        for(let i = 0; i < plataformas.length; i++) {
            const pl = plataformas[i];
            if (p.x < pl.x + pl.w && p.x + p.w > pl.x && p.y < pl.y + pl.h && p.y + p.h > pl.y) {
                let oy = Math.min(p.y + p.h - pl.y, pl.y + pl.h - p.y);
                let ox = Math.min(p.x + p.w - pl.x, pl.x + pl.w - p.x);
                if (oy < ox) {
                    if (p.vy > 0 && p.y < pl.y) { p.y = pl.y - p.h; p.vy = 0; p.enSuelo = true; }
                    else { p.y = pl.y + pl.h; p.vy *= -0.5; }
                } else { p.x = (p.x < pl.x) ? pl.x - p.w : pl.x + pl.w; p.vx *= -0.5; }
            }
        }

        if (score >= 100 && !boss.activo) { boss.activo = true; document.getElementById("boss-ui").style.display = "inline"; musicaTom.pause(); musicaCore.play(); }
        
        if (boss.activo) {
            boss.x += (p.x - boss.x) * 0.02; 
            boss.y += (p.y - boss.y) * 0.02;
            ctx.drawImage(imgRojo, Math.floor(boss.x), Math.floor(boss.y), boss.w, boss.h);
            if (Math.abs(p.x - boss.x) < 40 && Math.abs(p.y - boss.y) < 40 && invulnerable <= 0) {
                puntosVida -= 15; invulnerable = 60; sonidoDano.play();
                document.getElementById("vida").innerText = puntosVida;
                crearParticulas(p.x, p.y);
            }
        }

        spawnTimer++;
        // OPTIMIZATION: Increased spawn timer from 30 to 50 (fewer enemies)
        if (spawnTimer > 50) {
            enemigos.push({ x: Math.random()*800, y: 0, vx: (Math.random()-0.5)*8, vy: 2 });
            spawnTimer = 0;
            if (!huevo.activo) { huevo.x = Math.random()*700; huevo.y = Math.random()*400; huevo.activo = true; }
        }

        // OPTIMIZATION: Remove off-screen enemies and draw them
        for(let i = enemigos.length - 1; i >= 0; i--) {
            const en = enemigos[i];
            en.x += en.vx; 
            en.y += en.vy;
            
            // Remove if off-screen
            if (en.y > 650) {
                enemigos.splice(i, 1);
                continue;
            }
            
            ctx.drawImage(imgRojo, Math.floor(en.x), Math.floor(en.y), 40, 40);
            if (Math.abs(p.x - en.x) < 30 && Math.abs(p.y - en.y) < 30 && invulnerable <= 0) {
                puntosVida--; invulnerable = 60; sonidoDano.play();
                document.getElementById("vida").innerText = puntosVida;
                crearParticulas(p.x, p.y);
            }
        }

        if (huevo.activo) {
            ctx.drawImage(imgHuevo, Math.floor(huevo.x), Math.floor(huevo.y), 35, 35);
            if (Math.abs(p.x - huevo.x) < 40 && Math.abs(p.y - huevo.y) < 40) {
                huevo.activo = false; flash = 1; score++; 
                document.getElementById("puntos").innerText = score;
                sonidoExp.play();
                // OPTIMIZATION: Reduced particle count from 15 to 8
                for(let i = 0; i < enemigos.length; i++) {
                    crearParticulas(enemigos[i].x, enemigos[i].y, 5);
                }
                enemigos = [];
                if (boss.activo) { 
                    boss.hp--; document.getElementById("boss-hp").innerText = boss.hp;
                    if (boss.hp <= 0) finalizar("¡VICTORIA! EL CORE HA SIDO DESTRUIDO");
                }
            }
        }

        if (puntosVida <= 0) finalizar("¡GAME OVER! TE HAS QUEDADO SIN VIDA");
    }

    // Draw player with invulnerability flashing
    if (invulnerable > 0) { 
        invulnerable--; 
        ctx.globalAlpha = 0.4; 
    } else {
        ctx.globalAlpha = 1;
    }
    
    if (!p.mirandoDerecha) { 
        ctx.save();
        ctx.translate(Math.floor(p.x) + p.w, Math.floor(p.y)); 
        ctx.scale(-1, 1); 
        ctx.drawImage(imgPollo, 0, 0, p.w, p.h); 
        ctx.restore();
    }
    else { 
        ctx.drawImage(imgPollo, Math.floor(p.x), Math.floor(p.y), p.w, p.h); 
    }
    
    ctx.globalAlpha = 1;

    // Draw particles - OPTIMIZATION: Reduced from 15 to 8 particles per burst
    for(let i = particulas.length - 1; i >= 0; i--) {
        const part = particulas[i];
        part.x += part.vx; 
        part.y += part.vy; 
        part.vida--;
        ctx.fillStyle = part.color;
        ctx.fillRect(Math.floor(part.x), Math.floor(part.y), 5, 5);
        if(part.vida <= 0) {
            particulas.splice(i, 1);
        }
    }

    // Flash effect when collecting egg
    if (flash > 0) { 
        ctx.fillStyle = `rgba(255, 255, 255, ${flash})`; 
        ctx.fillRect(0, 0, 800, 600); 
        flash -= 0.05;
    }
    
    requestAnimationFrame(bucleJuego);
}
</script>
</body>
</html>
